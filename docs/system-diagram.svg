<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Block diagram: start module and three distance sensors feed lidar_sensor.py and main.py, which drive the steering servo and the Motoron motor controller. Config.py supplies parameters.">
<style>
.box { fill: #ffffff; stroke: #9aa6b2; stroke-width: 1.2; }
.hw { fill: #f3f5f7; stroke: #9aa6b2; stroke-width: 1.2; }
.group { fill: none; stroke: #9aa6b2; stroke-width: 1.2; stroke-dasharray: 5 4; }
.main-group { fill: #e4ecf8; stroke: #1f5fbf; stroke-width: 1.4; }
.ctl { fill: #ffffff; stroke: #1f5fbf; stroke-width: 1.2; }
.safe { fill: #fbeedd; stroke: #b35c00; stroke-width: 1.2; }
.t { fill: #17202a; font: 500 13px "IBM Plex Sans", system-ui, sans-serif; }
.tc { fill: #17202a; font: 500 13px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.s { fill: #5b6875; font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.gt { fill: #17202a; font: 600 14px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
.lbl { fill: #5b6875; font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.lbl-a { fill: #1f5fbf; font: 500 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.lbl-s { fill: #b35c00; font: 500 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.w { fill: none; stroke: #17202a; stroke-width: 1.3; }
.wa { fill: none; stroke: #1f5fbf; stroke-width: 1.6; }
.ws { fill: none; stroke: #b35c00; stroke-width: 1.5; }
.wd { fill: none; stroke: #9aa6b2; stroke-width: 1.2; stroke-dasharray: 4 4; }
.head { fill: #17202a; }
.head-a { fill: #1f5fbf; }
.head-s { fill: #b35c00; }
.head-d { fill: #9aa6b2; }
.bgr { fill: #ffffff; }
@media (prefers-color-scheme: dark) {
  .box { fill: #182029; stroke: #5b6977; stroke-width: 1.2; }
  .hw { fill: #11161c; stroke: #5b6977; stroke-width: 1.2; }
  .group { fill: none; stroke: #5b6977; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .main-group { fill: #1d2b40; stroke: #7eaaf0; stroke-width: 1.4; }
  .ctl { fill: #182029; stroke: #7eaaf0; stroke-width: 1.2; }
  .safe { fill: #3a2a17; stroke: #f0a24f; stroke-width: 1.2; }
  .t { fill: #e3e9ef; font: 500 13px "IBM Plex Sans", system-ui, sans-serif; }
  .tc { fill: #e3e9ef; font: 500 13px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .s { fill: #93a1ae; font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .gt { fill: #e3e9ef; font: 600 14px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
  .lbl { fill: #93a1ae; font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .lbl-a { fill: #7eaaf0; font: 500 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .lbl-s { fill: #f0a24f; font: 500 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .w { fill: none; stroke: #e3e9ef; stroke-width: 1.3; }
  .wa { fill: none; stroke: #7eaaf0; stroke-width: 1.6; }
  .ws { fill: none; stroke: #f0a24f; stroke-width: 1.5; }
  .wd { fill: none; stroke: #5b6977; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .head { fill: #e3e9ef; }
  .head-a { fill: #7eaaf0; }
  .head-s { fill: #f0a24f; }
  .head-d { fill: #5b6977; }
  .bgr { fill: #182029; }
}
</style>
<rect width="1000" height="600" class="bgr"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
          <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-a"/></marker>
          <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-s"/></marker>
          <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-d"/></marker>
        </defs>

        <!-- column headings -->
        <text x="20" y="22" class="lbl">INPUTS (HARDWARE)</text>
        <text x="810" y="22" class="lbl">OUTPUTS (HARDWARE)</text>

        <!-- Inputs -->
        <rect x="20" y="40" width="170" height="56" rx="4" class="hw"/>
        <text x="34" y="63" class="t">Start module</text>
        <text x="34" y="82" class="s">GPIO17 · pull-down</text>

        <rect x="20" y="160" width="170" height="56" rx="4" class="hw"/>
        <text x="34" y="183" class="t">Left sensor</text>
        <text x="34" y="202" class="s">VL53L4CX · 0x30</text>

        <rect x="20" y="240" width="170" height="56" rx="4" class="hw"/>
        <text x="34" y="263" class="t">Middle sensor</text>
        <text x="34" y="282" class="s">VL53L0X · 0x29</text>

        <rect x="20" y="320" width="170" height="56" rx="4" class="hw"/>
        <text x="34" y="343" class="t">Right sensor</text>
        <text x="34" y="362" class="s">VL53L4CX · 0x31</text>

        <text x="20" y="400" class="lbl">I²C0 · SDA 11 / SCL 12</text>
        <text x="20" y="416" class="lbl">400 kHz · XSHUT 7 / 6 / 8</text>

        <!-- lidar_sensor.py -->
        <rect x="250" y="130" width="220" height="270" rx="6" class="group"/>
        <text x="264" y="152" class="gt">lib/lidar_sensor.py</text>
        <rect x="265" y="166" width="190" height="44" rx="3" class="box"/>
        <text x="277" y="185" class="t">XSHUT boot sequence</text>
        <text x="277" y="201" class="s">one at a time, set address</text>
        <rect x="265" y="222" width="190" height="44" rx="3" class="box"/>
        <text x="277" y="241" class="tc">_Channel ×3</text>
        <text x="277" y="257" class="s">timeout · restart · dead</text>
        <rect x="265" y="278" width="190" height="44" rx="3" class="box"/>
        <text x="277" y="297" class="tc">_RollingMedian</text>
        <text x="277" y="313" class="s">window 3, drops spikes</text>
        <rect x="265" y="334" width="190" height="44" rx="3" class="ctl"/>
        <text x="277" y="353" class="tc">las_avstand()</text>
        <text x="277" y="369" class="s">returns dl, dm, dr</text>
        <path d="M360 210 V222" class="w" marker-end="url(#ar)"/>
        <path d="M360 266 V278" class="w" marker-end="url(#ar)"/>
        <path d="M360 322 V334" class="w" marker-end="url(#ar)"/>

        <!-- sensor wires -->
        <path d="M190 188 H250" class="w" marker-end="url(#ar)"/>
        <path d="M190 268 H250" class="w" marker-end="url(#ar)"/>
        <path d="M190 348 H250" class="w" marker-end="url(#ar)"/>
        <text x="196" y="182" class="lbl">I²C</text>

        <!-- main.py -->
        <rect x="520" y="20" width="240" height="430" rx="6" class="main-group"/>
        <text x="534" y="42" class="gt">main.py · run()</text>

        <rect x="535" y="56" width="210" height="48" rx="3" class="ctl"/>
        <text x="547" y="76" class="tc">start_requested()</text>
        <text x="547" y="93" class="s">go / no-go</text>

        <rect x="535" y="120" width="210" height="48" rx="3" class="safe"/>
        <text x="547" y="140" class="t">Blackout check</text>
        <text x="547" y="157" class="s">all ≥1200 mm, 5 frames</text>

        <rect x="535" y="184" width="210" height="48" rx="3" class="ctl"/>
        <text x="547" y="204" class="tc">compute()</text>
        <text x="547" y="221" class="s">steer ← dr−dl, speed ← dm</text>

        <rect x="535" y="248" width="210" height="48" rx="3" class="safe"/>
        <text x="547" y="268" class="tc">check_stuck() → backWard()</text>
        <text x="547" y="285" class="s">&lt;250 mm, still 2 s → reverse</text>

        <rect x="535" y="312" width="210" height="48" rx="3" class="ctl"/>
        <text x="547" y="332" class="tc">set_steer() · drive()</text>
        <text x="547" y="349" class="s">clamped angle and speed</text>

        <rect x="535" y="376" width="210" height="48" rx="3" class="safe"/>
        <text x="547" y="396" class="tc">stop_all()</text>
        <text x="547" y="413" class="s">brake 800, center wheels</text>

        <path d="M640 104 V120" class="wa" marker-end="url(#ara)"/>
        <path d="M640 168 V184" class="wa" marker-end="url(#ara)"/>
        <path d="M640 232 V248" class="wa" marker-end="url(#ara)"/>
        <path d="M640 296 V312" class="wa" marker-end="url(#ara)"/>

        <!-- start module to main -->
        <path d="M190 68 H535" class="w" marker-end="url(#ar)"/>
        <text x="300" y="60" class="lbl">pin level, every loop</text>

        <!-- distances to main -->
        <path d="M455 356 H495 V144 H535" class="wa" marker-end="url(#ara)"/>
        <text x="480" y="122" class="lbl-a" text-anchor="end">dl, dm, dr (mm)</text>

        <!-- Outputs -->
        <rect x="810" y="290" width="170" height="60" rx="4" class="hw"/>
        <text x="824" y="313" class="t">Steering servo</text>
        <text x="824" y="333" class="s">servo.py · GPIO18 PWM</text>

        <rect x="810" y="370" width="170" height="60" rx="4" class="hw"/>
        <text x="824" y="393" class="t">Motoron controller</text>
        <text x="824" y="413" class="s">motoron.py · I²C 0x10</text>

        <rect x="810" y="460" width="170" height="44" rx="4" class="hw"/>
        <text x="824" y="487" class="t">Drive motor</text>
        <text x="960" y="487" class="s" text-anchor="end">ch 1</text>

        <path d="M745 326 H790 V320 H810" class="wa" marker-end="url(#ara)"/>
        <text x="785" y="313" class="lbl-a" text-anchor="middle">angle</text>
        <path d="M745 346 H785 V390 H810" class="wa" marker-end="url(#ara)"/>
        <text x="790" y="363" class="lbl-a">speed</text>
        <path d="M745 412 H810" class="ws" marker-end="url(#ars)"/>
        <text x="778" y="428" class="lbl-s" text-anchor="middle">brake</text>
        <path d="M895 430 V460" class="w" marker-end="url(#ar)"/>

        <!-- Config -->
        <rect x="20" y="530" width="960" height="48" rx="4" class="box"/>
        <text x="36" y="551" class="tc">Config.py</text>
        <text x="36" y="568" class="s">pins · speeds (cruise 250, max 800) · distance thresholds · sensor timing budgets · filter size · fail limits</text>
        <path d="M360 530 V400" class="wd" marker-end="url(#ard)"/>
        <path d="M640 530 V450" class="wd" marker-end="url(#ard)"/>
        <text x="368" y="470" class="lbl">read at import</text>
      </svg>
